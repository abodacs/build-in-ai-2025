name: Performance Monitoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run performance tests daily
    - cron: '0 2 * * *'

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:5173
            http://localhost:5173/summarizer
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Analyze bundle
        run: |
          npx vite-bundle-visualizer --output bundle-analysis.html
          du -sh dist/*

      - name: Check bundle size limits
        run: |
          MAX_SIZE_KB=500

          # Calculate Brotli compressed size (what actually gets served)
          BROTLI_SIZE_KB=$(find dist -name "*.br" -exec du -k {} \; | awk '{sum+=$1} END {print sum}')

          # Also show uncompressed size for reference
          DIST_SIZE_KB=$(du -sk dist | cut -f1)

          echo "Bundle size (uncompressed): ${DIST_SIZE_KB}KB"
          echo "Bundle size (Brotli): ${BROTLI_SIZE_KB}KB (limit: ${MAX_SIZE_KB}KB)"

          if [ $BROTLI_SIZE_KB -gt $MAX_SIZE_KB ]; then
            echo "❌ Brotli compressed bundle size exceeds limit!"
            exit 1
          else
            echo "✅ Brotli compressed bundle size within limit"
          fi

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: bundle-analysis.html
          retention-days: 30

  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run performance tests
        run: pnpm vitest run src/features/unified-playground/api-modules/summarizer/__tests__/performance.test.ts --reporter=verbose

      - name: Generate performance report
        run: |
          echo "## ⚡ Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Performance benchmarks executed successfully!" >> $GITHUB_STEP_SUMMARY
